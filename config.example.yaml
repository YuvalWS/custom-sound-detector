# custom-sound-detector configuration. Every key is optional; the defaults and their
# explanations are in sounddetector/config.py. The common settings can also be changed in
# the web UI (Settings tab), which stores them in <data_dir>/settings.yaml, overriding this file.

source:
  # A name for this microphone: part of the MQTT topics and the Home Assistant entity id.
  name: front_door
  # Anything ffmpeg can read, WITHOUT a login in it. For a Frigate camera, its go2rtc
  # restream, ideally a stream with a single audio track:
  # url: rtsp://frigate.local:8554/front_door_audio
  # The login, if the stream needs one. Any characters: it is percent-encoded for you.
  # username: restream
  # password: secret

mqtt:
  enabled: true
  host: homeassistant.local
  port: 1883
  # username: mqtt-user
  # password: secret

web:
  port: 8080
  username: admin
  # The clips are recordings of your doorstep: keep the web UI behind a password.
  password: WEB_PASSWORD

collection:
  # Save a clip of every sound event, for labeling. Clips that trigger a detection are
  # saved even when this is off.
  enabled: true
  # A sound event starts 15 dB above the background and at least this loud.
  # `sound-detector check` prints your stream's levels.
  min_dbfs: -55
  max_clips_per_hour: 120
  max_disk_mb: 2000

detection:
  # Labels with a trained model to publish to MQTT (one binary_sensor each).
  targets: [knock]
  # Seconds without a hit before the sensor turns off again.
  off_delay: 10
  # Override the threshold training chose, per label:
  # thresholds: {knock: 0.8}

training:
  # Training picks the threshold that finds the most sounds within this budget.
  false_alarms_per_week: 1
