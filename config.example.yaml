# custom-sound-detector configuration. Every key is optional except source.url;
# the defaults and their explanations are in sounddetector/config.py.

source:
  # A name for this microphone: used in clip names and MQTT topics.
  name: front_door
  # Anything ffmpeg can read. For a Frigate camera, use its go2rtc restream, ideally a
  # stream that carries only one audio track.
  url: rtsp://frigate.local:8554/front_door

mqtt:
  enabled: true
  host: homeassistant.local
  port: 1883
  username: sound-detector
  password: change-me

web:
  port: 8080
  username: admin
  # The clips are recordings of your doorstep: keep the labeling UI behind a password.
  password: change-me

collection:
  # Save a clip of every sound event, for labeling. Clips that trigger a detection are
  # saved even when this is off.
  enabled: true
  # A sound event starts 15 dB above the background and at least this loud.
  # `sound-detector check` prints your stream's levels.
  min_dbfs: -55
  max_clips_per_hour: 120
  max_disk_mb: 2000

detection:
  # Labels with a trained model to publish to MQTT (one binary_sensor each).
  targets: [knock]
  # Seconds without a hit before the sensor turns off again.
  off_delay: 10
  # Override the threshold training chose, per label:
  # thresholds: {knock: 0.7}
